<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mango Portfolio</title>
    <!-- Fonte do Google para um visual moderno -->
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="#home">Home</a>
            <a href="#detalhes">Detalhes</a>
            <a href="#faq">FAQ</a>
        </div>
    </nav>

    <main class="container">
        <header id="home" class="hero">
            <h1>Murilo_W</h1>
            <p class="subtitle">Bem-vindo ao meu portfólio online</p>
        </header>

        <section id="detalhes" class="gallery">
            <div class="card">
                <img id="dantefocus" src="dante.jpg" alt="Foto do Dante">
                <div class="card-info"><h3>Dante</h3></div>
            </div>
            <div class="card">
                <img id="vergilfocus" src="vergil.webp" alt="I am the storm that is approaching">
                <div class="card-info"><h3>Vergil</h3></div>
            </div>
        </section>

        <section id="faq" class="contact-section">
            <h2>Contato & FAQ</h2>
            <form id="meu-form">
                <div class="input-group">
                    <label for="email">Digite seu email</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="message">Mande uma mensagem:</label>
                    <textarea id="message" placeholder="Sua mensagem aqui..." required></textarea>
                </div>
                <button type="submit">Send</button>
                <div id="texto-post" class="response-box">Aguardando resposta...</div>
            </form>
        </section>
    </main>

    <script>
      const form = document.getElementById("meu-form");
      const textoPost = document.getElementById("texto-post");

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        textoPost.classList.add("loading");
        textoPost.innerText = "🤖 A IA está pensando...";

        const response = await fetch('https://murilow.app.n8n.cloud/webhook/edc91cd4-fae6-4a8d-920d-8fab4f2abf96', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
          })
        });

        const text = await response.text();
        textoPost.classList.remove("loading");
        textoPost.innerHTML = marked.parse(text);
      });
    </script>
</body>
</html>
