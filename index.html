<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav>
        <p>home</p>
        <p>detalhes</p>
        <p>faq</p>
    </nav>
    <h1>mango</h1>
    <img id="dantefocus" src="dante.jpg" alt="fotododante">
    <img id="vergilfocus" src="vergil.webp" alt="iamstormthatisaproiching">
    <form
  id="meuform"
  
>
  <label>
    Your email:
    <input type="email" name="email">
  </label>
  <label>
    Your message:
    <textarea name="message"></textarea>
  </label>
  <!-- your other form fields go here -->
  <button type="submit">Send</button>
</form>
<script>
      const form = document.getElementById('meu-form');
      const textoPost = document.getElementById('texto-post');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        textoPost.innerText = "🤖 A IA está pensando...";

        // Faz a requisição direto para o Webhook de PRODUÇÃO do n8n
        const response = await fetch('https://murilow.app.n8n.cloud/webhook/edc91cd4-fae6-4a8d-920d-8fab4f2abf96', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
          })
        });

        // Pede para o navegador ler a resposta como texto puro
        const text = await response.text();

        // Substitui o texto pela resposta da IA!
        textoPost.innerHTML = marked.parse(text);
      });
    </script>
  </script>
</body>
</html>
